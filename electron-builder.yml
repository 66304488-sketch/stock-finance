appId: com.stockfinance.heatmap
productName: 行业热力图
copyright: Copyright © 2026

mac:
  category: public.app-category.finance
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  artifactName: "${name}-${version}-mac.${ext}"

dmg:
  contents:
    - x: 140
      y: 190
    - x: 420
      y: 190
      type: link
      path: /Applications
    - x: 280
      y: 360
      type: file
      path: "安装运行依赖.command"

files:
  - dist/electron/**/*
  - resources/**/*

extraResources:
  - from: setup.sh
    to: setup.sh
  - from: "安装运行依赖.command"
    to: "安装运行依赖.command"
  - from: static/
    to: static/
