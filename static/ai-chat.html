<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 市场问答</title>
<style>
  :root {
    --bg: #1a1d23;
    --bg-card: #21252b;
    --bg-input: #282c34;
    --text: #abb2bf;
    --text-bright: #e5e5e5;
    --accent: #61afef;
    --green: #98c379;
    --red: #e06c75;
    --border: #333842;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    text-align: center;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-bright);
    font-size: 1.1em;
    font-weight: 600;
  }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    word-wrap: break-word;
    font-size: 0.95em;
  }
  .msg-user {
    align-self: flex-end;
    background: #2c5aa0;
    color: #e5e5e5;
    border-bottom-right-radius: 4px;
  }
  .msg-ai {
    align-self: flex-start;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-ai code {
    background: #1a1d23;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--accent);
    font-size: 0.9em;
  }
  .msg-ai strong { color: var(--text-bright); }
  .msg-ai li { margin: 3px 0; }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-bright);
    font-size: 0.95em;
    font-family: inherit;
    outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    background: var(--accent);
    color: #1a1d23;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  .suggestions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .suggestions span {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 5px 14px;
    font-size: 0.8em;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .suggestions span:hover { border-color: var(--accent); color: var(--text-bright); }

  .typing {
    align-self: flex-start;
    padding: 10px 14px;
    color: var(--accent);
  }
  .typing::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0%,20%{content:'.';} 40%{content:'..';} 60%,100%{content:'...';} }
</style>
</head>
<body>

<div class="header">🤖 AI 市场助手</div>
<div class="chat-area" id="chatArea">
  <div class="msg msg-ai">
    你好！我是 AI 市场助手。<br><br>
    我可以帮你分析当前市场情况，比如：<br>
    • 某个行业最近表现怎么样<br>
    • 哪些股票值得关注<br>
    • 市场整体基调如何<br>
    请直接提问 💬
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <input type="text" id="userInput" placeholder="输入问题，如「电子行业怎么样」" onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
  <div class="suggestions" id="suggestions">
    <span onclick="ask('电子行业怎么样')">电子行业怎么样</span>
    <span onclick="ask('医药生物最近表现')">医药生物最近表现</span>
    <span onclick="ask('哪些行业在创新高')">哪些行业在创新高</span>
    <span onclick="ask('今天市场整体基调')">今天市场整体基调</span>
    <span onclick="ask('银行新低这么多，能抄底吗')">银行新低能抄底吗</span>
  </div>
</div>

<script>
let isStreaming = false;

async function send() {
  if (isStreaming) return;
  const input = document.getElementById('userInput');
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  ask(question);
}

function ask(question) {
  if (isStreaming) return;
  appendMsg('user', question);
  streamAnswer(question);
}

function appendMsg(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg msg-${role}`;
  div.innerHTML = formatMsg(text);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function streamAnswer(question) {
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('userInput').placeholder = 'AI 正在思考...';

  const aiDiv = appendMsg('ai', '');
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            if (j.delta) {
              aiDiv.innerHTML += formatMsg(j.delta);
            }
            if (j.error) {
              aiDiv.innerHTML += `<span style="color:#e06c75">${j.error}</span>`;
            }
          } catch {}
        }
      }
      document.getElementById('chatArea').scrollTop =
        document.getElementById('chatArea').scrollHeight;
    }
  } catch (err) {
    aiDiv.innerHTML += `<span style="color:#e06c75">请求失败: ${err.message}</span>`;
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('userInput').placeholder = '输入问题...';
  document.getElementById('userInput').focus();
}

function formatMsg(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/\n/g, '<br>');
}
</script>
</body>
</html>
