<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业创新高个股分布</title>
<style>
  :root {
    --bg: #1a1d23;
    --surface: #21252b;
    --border: #333842;
    --text: #abb2bf;
    --text-bright: #dcdfe4;
    --text-dim: #6b717a;
    --header-bg: #282c34;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  .container { width: 100%; max-width: 1800px; }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .title-section h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.5px;
  }
  .title-section .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .subtitle span { color: #e5c07b; }

  /* Header right */
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  /* Legend */
  .legend-section {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .legend-bar {
    display: flex;
    height: 14px;
    border-radius: 3px;
    overflow: hidden;
    width: 180px;
  }
  .legend-bar span { flex: 1; }

  /* Type toggle */
  .type-toggle {
    display: flex;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .toggle-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .toggle-btn.active {
    background: #61afef;
    color: #1a1d23;
    font-weight: 600;
  }
  .toggle-btn:not(.active):hover {
    color: var(--text-bright);
    background: rgba(97,175,239,0.1);
  }

  /* Export button */
  .export-wrap { position: relative; }
  .export-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid #98c379;
    border-radius: 6px;
    background: transparent;
    color: #98c379;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .export-btn:hover:not(:disabled) { background: #98c379; color: #1a1d23; }
  .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .export-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-width: 140px;
    z-index: 50;
    overflow: hidden;
  }
  .export-dropdown.show { display: block; }
  .export-dropdown .export-date-option {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.1s;
  }
  .export-dropdown .export-date-option:hover { background: #2a2e36; color: var(--text-bright); }

  /* Loading state */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px;
    color: var(--text-dim);
    font-size: 16px;
  }
  .loading::before {
    content: '';
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: #61afef;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Table wrapper */
  .table-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .scroll-container {
    overflow-x: auto;
    max-height: 85vh;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1300px;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 3;
  }
  thead th {
    background: var(--header-bg);
    color: var(--text-bright);
    font-size: 12px;
    font-weight: 500;
    padding: 10px 6px;
    text-align: center;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    min-width: 50px;
  }
  thead th:first-child {
    position: sticky;
    left: 0;
    z-index: 4;
    text-align: left;
    min-width: 90px;
    padding-left: 14px;
  }
  thead th.col-total,
  thead th.col-ratio {
    background: #2a3040;
    color: #61afef;
  }

  /* Body */
  tbody td {
    font-size: 12px;
    padding: 5px 6px;
    text-align: center;
    border-bottom: 1px solid rgba(51,56,66,0.5);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--surface);
    text-align: left;
    font-weight: 500;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--text-bright);
    padding-left: 14px;
  }
  tbody tr:hover td:first-child { background: #2a2e36; }
  tbody tr:hover td { background: #2a2e36; }

  /* Heatmap cells */
  .heat-cell {
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s, box-shadow 0.1s;
    border-radius: 3px;
  }
  .heat-cell:hover {
    transform: scale(1.15);
    z-index: 5;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    outline: 2px solid rgba(255,255,255,0.5);
    outline-offset: -2px;
    border-radius: 3px;
  }
  .heat-cell.no-data { cursor: default; }
  .heat-cell.no-data:hover {
    transform: none;
    outline: none;
    box-shadow: none;
  }

  /* Stock count & ratio */
  td.col-total, td.col-ratio {
    background: rgba(42,48,64,0.4);
    color: #abb2bf;
    font-weight: 500;
  }
  td.col-ratio { font-weight: 600; }

  /* Totals row */
  tbody tr.row-total td {
    font-weight: 700 !important;
    font-size: 13px !important;
    border-top: 2px solid var(--border);
    background: #252830;
    color: var(--text-bright);
  }
  tbody tr.row-total td:first-child {
    color: #e5c07b;
    font-weight: 700;
  }

  /* Ratio color classes */
  .ratio-hot  { color: #e06c75 !important; }
  .ratio-warm { color: #e5c07b !important; }
  .ratio-cool { color: #61afef !important; }
  .ratio-cold { color: #98c379 !important; }

  /* Update info */
  .update-note {
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 90%;
    max-width: 620px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .modal-header-info { flex: 1; min-width: 0; }
  .modal-header-info h2 {
    font-size: 14px;
    color: var(--text-bright);
    margin: 0;
    line-height: 1.3;
    word-break: break-all;
  }
  .modal-header-info h2 .ind-name { color: #e5c07b; font-weight: 700; }
  .modal-header-info .modal-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .modal-header-info .modal-sub strong { color: var(--text-bright); }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .modal-close:hover { color: #e06c75; border-color: #e06c75; }

  .modal-body {
    padding: 10px 14px;
    overflow-y: auto;
    flex: 1;
  }

  .stock-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  .stock-table thead th {
    background: var(--header-bg);
    color: var(--text-dim);
    font-weight: 500;
    padding: 5px 4px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stock-table thead th.col-idx { width: 24px; }
  .stock-table thead th.col-code { width: 58px; }
  .stock-table thead th.col-name { text-align: left; }
  .stock-table thead th.col-price { width: 52px; }
  .stock-table thead th.col-chg { width: 58px; }
  .stock-table thead th.col-mp { width: 38px; color: #d19a66; font-size: 11px; }
  .stock-table tbody td {
    padding: 5px 4px;
    text-align: center;
    border-bottom: 1px solid rgba(51,56,66,0.3);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 12px;
    color: var(--text-bright);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stock-table tbody td.col-idx { color: var(--text-dim); }
  .stock-table tbody td.col-name { text-align: left; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .stock-table tbody td.col-mp { color: #d19a66; font-size: 11px; }
  .stock-table tbody tr:hover td { background: #2a2e36; }
  .stock-table .change-up { color: #e06c75; }
  .stock-table .change-down { color: #61afef; }

  .stock-table .stock-link {
    color: var(--text-bright);
    text-decoration: none;
  }
  .stock-table .stock-link:hover { color: #61afef; text-decoration: underline; }

  .modal-footer {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
  }

  /* 全市场弹窗行业分组标题 */
  .industry-group-title {
    font-size: 13px;
    color: #e5c07b;
    margin: 10px 0 4px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .industry-group-title span { color: var(--text-dim); font-weight: 400; }

  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 8px; }
    .header { flex-direction: column; align-items: flex-start; }
    .header-right { flex-direction: column; align-items: flex-start; gap: 10px; }
    table { min-width: 900px; }
    .modal { width: 98%; max-height: 92vh; border-radius: 8px; }
    .modal-header { padding: 8px 10px; }
    .modal-body { padding: 8px 10px; }
    .modal-footer { padding: 6px 10px; }
    .stock-table { font-size: 10px; }
    .stock-table thead th { padding: 3px 2px; font-size: 9px; }
    .stock-table thead th.col-idx { width: 18px; }
    .stock-table thead th.col-code { width: 48px; }
    .stock-table thead th.col-price { width: 44px; }
    .stock-table thead th.col-chg { width: 50px; }
    .stock-table thead th.col-mp { width: 32px; font-size: 10px; }
    .stock-table tbody td { padding: 3px 2px; font-size: 10px; }
  }

  /* Error message */
  .error-msg {
    padding: 80px 20px;
    text-align: center;
    color: #e06c75;
    font-size: 15px;
  }
  .error-msg button {
    margin-top: 16px;
    padding: 8px 20px;
    background: #61afef;
    color: #1a1d23;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="title-section">
      <h1>行业创新高/新低个股分布</h1>
      <div class="subtitle">申万一级行业 · <span id="directionLabel">新高</span> · <span id="typeLabel">创20日新高</span> · <span id="dateRange"></span></div>
    </div>
    <div class="header-right">
      <div class="legend-section">
        <span id="legendLabel">创新高家数</span>
        <div class="legend-bar">
          <span style="background:#3d8c40"></span>
          <span style="background:#6aaa3a"></span>
          <span style="background:#a8c43a"></span>
          <span style="background:#e5c73a"></span>
          <span style="background:#e8a236"></span>
          <span style="background:#e06c35"></span>
          <span style="background:#c93a3a"></span>
        </div>
        <span>少 → 多</span>
      </div>
      <div class="type-toggle" id="directionToggle">
        <button class="toggle-btn active" data-direction="highs">创新高</button>
        <button class="toggle-btn" data-direction="lows">创新低</button>
      </div>
      <div class="type-toggle" id="typeToggle">
        <button class="toggle-btn active" data-type="month">20日</button>
        <button class="toggle-btn" data-type="60d">60日</button>
        <button class="toggle-btn" data-type="120d">120日</button>
        <button class="toggle-btn" data-type="1year">一年新高</button>
        <button class="toggle-btn" data-type="alltime">收盘历史新高</button>
      </div>
      <div class="type-toggle" id="modeToggle" style="margin-top:6px">
        <button class="toggle-btn active" data-mode="daily">📊 收盘数据</button>
        <button class="toggle-btn" data-mode="intraday">📡 盘中实时</button>
      </div>
      <div class="export-wrap" id="exportWrap">
        <button class="export-btn" id="exportBtn" disabled>导出Excel</button>
        <div class="export-dropdown" id="exportDropdown"></div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div class="table-wrapper" id="mainContent">
    <div class="loading">正在加载数据...</div>
  </div>

  <div class="update-note" id="updateNote"></div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-info">
        <h2 id="modalTitle"></h2>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="/xlsx.full.min.js"></script>
<script>
// =========================================================================
//  数据加载 & 渲染
// =========================================================================

let currentType = 'month';
let currentDirection = 'highs';
let currentMode = 'daily';  // 'daily' | 'intraday'
let tableData = null;
let detailsData = null;
let detailsLoading = false;
let detailsLoadedType = null;
let detailsLoadedDirection = null;
let detailsLoadedMode = null;

function getUrls() {
  var suffix = currentType;
  var cb = '?_=' + Date.now();
  if (currentMode === 'intraday') {
    var intraSuffix = currentType === 'month' ? '20d' : currentType;
    var prefix2 = currentDirection === 'lows' ? 'intraday_lows' : 'intraday_highs';
    return {
      counts: '/' + prefix2 + '_' + intraSuffix + '.json' + cb,
      details: null,
    };
  }
  var prefix = currentDirection === 'lows' ? 'new_lows' : 'new_highs';
  return {
    counts: '/' + prefix + '_data_' + suffix + '.json' + cb,
    details: '/' + prefix + '_details_' + suffix + '.json' + cb,
  };
}

async function loadData() {
  var mainContent = document.getElementById('mainContent');
  mainContent.innerHTML = '<div class="loading">正在加载数据...</div>';
  try {
    var urls = getUrls();
    var resp = await fetch(urls.counts);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    tableData = await resp.json();
    updateLabels();
    renderTable();
    setupExportButton();
    document.getElementById('updateNote').textContent =
      '数据更新于 ' + (tableData.updated_at || 'unknown') + ' · 数据源: 同花顺/申万研究所 · 点击单元格查看个股明细';
  } catch (e) {
    var scriptName = currentDirection === 'lows' ? 'fetch_new_lows.py' : 'fetch_new_highs.py';
    mainContent.innerHTML =
      '<div class="error-msg">' +
      '数据加载失败: ' + e.message +
      '<br><button onclick="location.reload()">重试</button>' +
      '<br><br><span style="font-size:12px;color:var(--text-dim)">请先运行: python ' + scriptName + ' --type ' + currentType + '</span>' +
      '</div>';
  }
}

function updateLabels() {
  var dirLabel = currentDirection === 'lows' ? '新低' : '新高';
  document.getElementById('directionLabel').textContent = dirLabel;
  document.getElementById('legendLabel').textContent = '创' + dirLabel + '家数';
  // 更新类型切换按钮文字
  var btns = document.querySelectorAll('#typeToggle .toggle-btn');
  var newLabels = ['20日', '60日', '120日'];
  if (currentDirection === 'lows') {
    newLabels.push('一年新低');
    newLabels.push('收盘近7年新低');
  } else {
    newLabels.push('一年新高');
    newLabels.push('收盘历史新高');
  }
  for (var i = 0; i < btns.length && i < newLabels.length; i++) {
    btns[i].textContent = newLabels[i];
  }
}

async function ensureDetails() {
  if (detailsData && detailsLoadedType === currentType && detailsLoadedDirection === currentDirection && detailsLoadedMode === currentMode) return detailsData;
  if (detailsLoading) {
    while (detailsLoading) await new Promise(function(r) { setTimeout(r, 100); });
    if (detailsData && detailsLoadedType === currentType && detailsLoadedDirection === currentDirection && detailsLoadedMode === currentMode) return detailsData;
  }
  detailsLoading = true;
  try {
    if (currentMode === 'intraday') {
      // 盘中模式: 明细嵌入在 data JSON 的 daily_details 中
      detailsData = {};
      for (var i = 0; i < tableData.industries.length; i++) {
        var row = tableData.industries[i];
        var dd = row.daily_details || {};
        for (var d in dd) {
          if (!detailsData[row.industry]) detailsData[row.industry] = {};
          detailsData[row.industry][d] = dd[d];
        }
      }
      detailsLoadedType = currentType;
      detailsLoadedDirection = currentDirection;
      detailsLoadedMode = currentMode;
      return detailsData;
    }
    var urls = getUrls();
    if (!urls.details) return null;
    var resp = await fetch(urls.details);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    detailsData = await resp.json();
    detailsLoadedType = currentType;
    detailsLoadedDirection = currentDirection;
    detailsLoadedMode = currentMode;
    return detailsData;
  } catch (e) {
    console.error('加载明细失败:', e);
    return null;
  } finally {
    detailsLoading = false;
  }
}

// =========================================================================
//  颜色插值
// =========================================================================

function heatColor(value, maxVal) {
  if (value === 0) return { bg: 'rgba(45,58,45,0.4)', text: '#8aaa8a' };
  var t = Math.min(Math.max(value / Math.max(maxVal, 1), 0), 1);
  var r, g, b;
  if (t < 0.25) {
    var s = t / 0.25;
    r = Math.round(55  + s * 115);
    g = Math.round(135 + s * 45);
    b = Math.round(60  - s * 20);
  } else if (t < 0.5) {
    var s = (t - 0.25) / 0.25;
    r = Math.round(170 + s * 58);
    g = Math.round(180 - s * 20);
    b = 40;
  } else if (t < 0.75) {
    var s = (t - 0.5) / 0.25;
    r = Math.round(228 + s * 12);
    g = Math.round(160 - s * 80);
    b = Math.round(40 - s * 10);
  } else {
    var s = (t - 0.75) / 0.25;
    r = Math.round(240 - s * 20);
    g = Math.round(80  - s * 45);
    b = Math.round(30  + s * 5);
  }
  var lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return { bg: 'rgb(' + r + ',' + g + ',' + b + ')', text: lum > 140 ? '#1a1d23' : '#f0f0f0' };
}

// =========================================================================
//  渲染表格
// =========================================================================

function renderTable() {
  var data = tableData;
  if (!data || !data.industries || !data.dates) return;

  var fallbackLabels = { month: '创20日新高', '60d': '创60日新高', '120d': '创120日新高', '1year': '创一年新高', alltime: '收盘创历史新高' };
  var fallbackLabelsLows = { month: '创20日新低', '60d': '创60日新低', '120d': '创120日新低', '1year': '创一年新低', alltime: '收盘创近7年新低' };
  var labels = currentDirection === 'lows' ? fallbackLabelsLows : fallbackLabels;
  document.getElementById('typeLabel').textContent =
    data.type_label || labels[currentType] || '创新高';

  var windowLabels = { month: '近20个交易日', '60d': '近60个交易日', '120d': '近120个交易日', '1year': '近250个交易日', alltime: '上市以来' };
  var windowLabelsLows = { month: '近20个交易日', '60d': '近60个交易日', '120d': '近120个交易日', '1year': '近250个交易日', alltime: '近7年' };
  document.getElementById('dateRange').textContent =
    (currentDirection === 'lows' ? windowLabelsLows : windowLabels)[currentType] || '';

  var industries = data.industries.filter(function(r) { return !r.is_total; });
  var totalRow = data.industries.find(function(r) { return r.is_total; });

  var allValues = [];
  industries.forEach(function(r) { allValues = allValues.concat(r.daily_counts); });
  var sorted = allValues.slice().sort(function(a, b) { return a - b; });
  var p90 = sorted[Math.floor(sorted.length * 0.9)] || 1;
  var colorMax = Math.max(p90, 20);

  var mainContent = document.getElementById('mainContent');
  var html = '<div class="scroll-container" id="scrollContainer"><table id="heatmapTable"><thead><tr><th>行业</th>';

  data.dates.forEach(function(d) {
    html += '<th>' + d.label + '</th>';
  });
  html += '<th class="col-total">个股总数</th><th class="col-ratio">占比%</th></tr></thead><tbody>';

  industries.forEach(function(row) {
    html += '<tr>';
    html += '<td>' + row.industry + '</td>';

    row.daily_counts.forEach(function(count, di) {
      if (count > 0) {
        var c = heatColor(count, colorMax);
        var dateLabel = data.dates[di].label;
        html += '<td class="heat-cell" style="background:' + c.bg + ';color:' + c.text + '"' +
                ' data-industry="' + row.industry + '"' +
                ' data-date="' + dateLabel + '"' +
                ' data-count="' + count + '">' + count + '</td>';
      } else {
        html += '<td class="heat-cell no-data" style="background:rgba(45,58,45,0.3);color:#8aaa8a">0</td>';
      }
    });

    html += '<td class="col-total">' + row.total + '</td>';

    var ratio = row.ratio;
    var ratioClass = 'ratio-cold';
    if (ratio >= 7) ratioClass = 'ratio-hot';
    else if (ratio >= 5) ratioClass = 'ratio-warm';
    else if (ratio > 2) ratioClass = 'ratio-cool';
    html += '<td class="col-ratio ' + ratioClass + '">' + ratio.toFixed(1) + '%</td>';
    html += '</tr>';
  });

  // 合计行
  if (totalRow) {
    html += '<tr class="row-total"><td>全市场合计</td>';
    totalRow.daily_counts.forEach(function(count, di) {
      if (count > 0) {
        var c = heatColor(count, Math.max(colorMax * 2, count));
        var dateLabel = data.dates[di].label;
        html += '<td class="heat-cell" style="background:' + c.bg + ';color:' + c.text + '"' +
                ' data-industry="全市场"' +
                ' data-date="' + dateLabel + '"' +
                ' data-count="' + count + '">' + count + '</td>';
      } else {
        html += '<td class="heat-cell no-data" style="background:rgba(45,58,45,0.3);color:#8aaa8a">0</td>';
      }
    });
    var grandTotal = industries.reduce(function(s, r) { return s + r.total; }, 0);
    html += '<td class="col-total" style="color:#e5c07b">' + grandTotal + '</td>';
    html += '<td class="col-ratio">—</td></tr>';
  }

  html += '</tbody></table></div>';
  mainContent.innerHTML = html;
  setupTableClick();
}

function setupTableClick() {
  var table = document.getElementById('heatmapTable');
  if (!table) return;
  table.addEventListener('click', function(e) {
    var cell = e.target.closest('.heat-cell');
    if (!cell) return;
    var industry = cell.getAttribute('data-industry');
    var dateLabel = cell.getAttribute('data-date');
    var count = parseInt(cell.getAttribute('data-count')) || 0;
    if (!industry || !dateLabel || count === 0) return;

    if (industry === '全市场') {
      openTotalDetail(dateLabel, count);
    } else {
      openDetail(industry, dateLabel, count);
    }
  });
}

// ── 多周期新高/新低次数统计（从预计算轻量文件加载）──
var multiPeriodCache = {};  // key: direction, value: {code: [20d, 60d, 120d, 1year]}

async function loadMultiPeriodCounts(direction) {
  if (multiPeriodCache[direction]) return multiPeriodCache[direction];
  try {
    var url = '/' + direction + '_period_counts.json?_=' + Date.now();
    var resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    multiPeriodCache[direction] = data;
    return data;
  } catch(e) {
    console.error('loadMultiPeriod error:', e);
    return {};
  }
}

async function openDetail(industry, dateLabel, count) {
  document.getElementById('modalTitle').innerHTML = '<span class="ind-name">' + industry + '</span> ' + dateLabel;
  document.getElementById('modalSub').innerHTML = '';
  document.getElementById('modalBody').innerHTML = '<div class="loading">加载明细中...</div>';
  document.getElementById('modalFooter').innerHTML = '';
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';

  var details = await ensureDetails();
  if (!details) {
    document.getElementById('modalBody').innerHTML =
      '<div class="error-msg">明细数据加载失败，请<a href="javascript:location.reload()">刷新</a>重试</div>';
    return;
  }

  var indDetails = details[industry];
  var stocks = indDetails ? (indDetails[dateLabel] || []) : [];
  var row = null;
  for (var i = 0; i < tableData.industries.length; i++) {
    if (tableData.industries[i].industry === industry) { row = tableData.industries[i]; break; }
  }
  var total = row ? row.total : 0;
  var typeLabel = tableData.type_label || '创新高';
  var ratio = total > 0 ? (stocks.length / total * 100).toFixed(1) : '0';

  document.getElementById('modalTitle').innerHTML =
    '<span class="ind-name">' + industry + '</span> ' + dateLabel;
  document.getElementById('modalSub').innerHTML =
    typeLabel + ' · <strong>' + stocks.length + '</strong> 只 · 占比 <strong>' + ratio + '%</strong> · 行业共 ' + total + ' 只';

  var mpCounts = {};
  loadMultiPeriodCounts(currentDirection).then(function(data) {
    mpCounts = data || {};
    // 更新已渲染的计数单元格
    var rows = document.querySelectorAll('#modalBody .stock-table tbody tr');
    rows.forEach(function(tr, i) {
      if (i < stocks.length) {
        var code = stocks[i].code;
        var cnt = mpCounts[code] || [0,0,0,0];
        var tds = tr.querySelectorAll('.col-mp');
        if (tds.length === 4) {
          tds[0].textContent = cnt[0];
          tds[1].textContent = cnt[1];
          tds[2].textContent = cnt[2];
          tds[3].textContent = cnt[3];
        }
      }
    });
  }).catch(function(e) {
    console.error('多周期计数加载失败:', e);
  });

  var html = '<div style="max-height:55vh;overflow-y:auto;"><table class="stock-table"><thead><tr>';
  html += '<th class="col-idx">#</th><th class="col-code">代码</th><th class="col-name">名称</th><th class="col-price">价格</th><th class="col-chg">涨跌</th>';
  html += '<th class="col-mp">20日</th><th class="col-mp">60日</th><th class="col-mp">120日</th><th class="col-mp">一年</th>';
  html += '</tr></thead><tbody>';

  stocks.forEach(function(s, i) {
    var changeCls = s.change_pct >= 0 ? 'change-up' : 'change-down';
    var sign = s.change_pct >= 0 ? '+' : '';
    var prefix = s.code.startsWith('6') ? 'sh' : 'sz';
    html += '<tr>' +
      '<td class="col-idx">' + (i + 1) + '</td>' +
      '<td class="col-code"><a class="stock-link" href="https://stockpage.10jqka.com.cn/' + s.code + '/" target="_blank">' + s.code + '</a></td>' +
      '<td class="col-name">' + s.name + '</td>' +
      '<td class="col-price">' + s.price.toFixed(2) + '</td>' +
      '<td class="col-chg ' + changeCls + '">' + sign + s.change_pct.toFixed(2) + '%</td>' +
      '<td class="col-mp">-</td><td class="col-mp">-</td><td class="col-mp">-</td><td class="col-mp">-</td>' +
      '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalFooter').innerHTML = '共 ' + stocks.length + ' 只 · 点击代码跳转同花顺';
}

document.getElementById('typeToggle').addEventListener('click', function(e) {
  var btn = e.target.closest('.toggle-btn');
  if (!btn) return;
  var newType = btn.getAttribute('data-type');
  if (newType === currentType) return;

  currentType = newType;
  var buttons = this.querySelectorAll('.toggle-btn');
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
  btn.classList.add('active');

  detailsData = null;
  detailsLoadedType = null;
  detailsLoadedDirection = null;
  loadData();
});

// 方向切换（新高 / 新低）
document.getElementById('directionToggle').addEventListener('click', function(e) {
  var btn = e.target.closest('.toggle-btn');
  if (!btn) return;
  var newDir = btn.getAttribute('data-direction');
  if (newDir === currentDirection) return;

  currentDirection = newDir;
  var buttons = this.querySelectorAll('.toggle-btn');
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
  btn.classList.add('active');

  detailsData = null;
  detailsLoadedType = null;
  detailsLoadedDirection = null;
  detailsLoadedMode = null;
  loadData();
});

// 模式切换（收盘数据 / 盘中实时）
document.getElementById('modeToggle').addEventListener('click', function(e) {
  var btn = e.target.closest('.toggle-btn');
  if (!btn) return;
  var newMode = btn.getAttribute('data-mode');
  if (newMode === currentMode) return;

  currentMode = newMode;
  var buttons = this.querySelectorAll('.toggle-btn');
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
  btn.classList.add('active');

  // 盘中模式隐藏 alltime（历史数据不支持盘中）
  var typeBtns = document.querySelectorAll('#typeToggle .toggle-btn');
  for (var j = 0; j < typeBtns.length; j++) {
    var tb = typeBtns[j];
    if (tb.getAttribute('data-type') === 'alltime') {
      tb.style.display = currentMode === 'intraday' ? 'none' : '';
    }
  }
  // 切换到盘中时默认选 20d
  if (currentMode === 'intraday' && currentType === 'alltime') {
    currentType = 'month';
    for (var k = 0; k < typeBtns.length; k++) {
      typeBtns[k].classList.remove('active');
      if (typeBtns[k].getAttribute('data-type') === 'month') typeBtns[k].classList.add('active');
    }
  }

  detailsData = null;
  detailsLoadedType = null;
  detailsLoadedDirection = null;
  detailsLoadedMode = null;
  loadData();
});

function setupExportButton() {
  var btn = document.getElementById('exportBtn');
  btn.disabled = false;
  var dropdown = document.getElementById('exportDropdown');
  if (!tableData || !tableData.dates) return;

  var html = '';
  tableData.dates.forEach(function(d) {
    html += '<div class="export-date-option" data-date="' + d.label + '">' + d.label + ' (' + d.full_label + ')</div>';
  });
  dropdown.innerHTML = html;

  // 避免 listener 累积：先移除旧 listener 再绑定
  dropdown.removeEventListener('click', _onExportClick);
  dropdown.addEventListener('click', _onExportClick);
}

function _onExportClick(e) {
  var opt = e.target.closest('.export-date-option');
  if (!opt) return;
  var dateLabel = opt.getAttribute('data-date');
  document.getElementById('exportDropdown').classList.remove('show');
  exportToExcel(dateLabel);
}

document.getElementById('exportBtn').addEventListener('click', function() {
  var dropdown = document.getElementById('exportDropdown');
  dropdown.classList.toggle('show');
});

document.addEventListener('click', function(e) {
  var wrap = document.getElementById('exportWrap');
  if (!wrap.contains(e.target)) {
    document.getElementById('exportDropdown').classList.remove('show');
  }
});

async function exportToExcel(dateLabel) {
  var details = await ensureDetails();
  if (!details) {
    alert('请先加载明细数据（点击任意热力图单元格）');
    return;
  }

  var rows = [];
  var typeLabel = tableData.type_label || '创新高';

  for (var ind in details) {
    if (ind === '全市场合计') continue;
    var dateData = details[ind];
    var stocks = dateData ? (dateData[dateLabel] || []) : [];
    stocks.forEach(function(s) {
      rows.push({
        '行业': ind,
        '股票代码': s.code,
        '股票名称': s.name,
        '最新价': s.price,
        '涨跌幅%': s.change_pct,
      });
    });
  }

  if (rows.length === 0) {
    alert(dateLabel + ' 无数据可导出');
    return;
  }

  if (typeof XLSX === 'undefined') {
    alert('Excel 库加载失败，请刷新页面后重试');
    return;
  }

  // 按行业分组排序
  rows.sort(function(a, b) {
    if (a['行业'] !== b['行业']) return a['行业'].localeCompare(b['行业']);
    return b['涨跌幅%'] - a['涨跌幅%'];
  });

  var ws = XLSX.utils.json_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, dateLabel);
  var filename = typeLabel + '_' + dateLabel + '.xlsx';
  XLSX.writeFile(wb, filename);
}
